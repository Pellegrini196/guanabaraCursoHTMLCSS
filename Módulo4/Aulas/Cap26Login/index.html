<body>
    <main>
        <section id="bemvindo">
            <h1>Login</h1>
            <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
        </section>

        <section id="menu">
            <form action="cadastro.php" method="post" autocomplete="off">
                <div class="campo-icone">
                    <i class="material-icons">person</i>
                    <input type="text" name="fuser" id="campouser" placeholder="seu email aqui">
                </div>

                <div class="campo-icone">
                    <i class="material-icons">key</i>
                    <input type="password" name="fkey" id="campokey" placeholder="sua senha">
                </div>

                <button id="entrar" type="submit">Entrar</button>

                <button id="esquecer" type="button">
                    Esqueci a senha <i class="material-icons">mail</i>
                </button>
            </form>
        </section>
    </main>
