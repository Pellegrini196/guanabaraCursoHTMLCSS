<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Open Graph Image: Light version for social sharing -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;display=swap');
  </style>
  <rect width="1200" height="630" fill="#f5f7f6"/>
  <!-- Subtle pattern -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#noise)" opacity="0.03"/>
  <defs>
    <pattern id="noise" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1" fill="#1a6b47" opacity="0.3"/>
      <circle cx="75" cy="75" r="1" fill="#1a6b47" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#1a6b47"/>
  <!-- Logo centered -->
  <text x="600" y="300" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="140">
    <tspan fill="#1a6b47">&gt;</tspan><tspan fill="#1a1a1a">mp</tspan><tspan fill="#1a6b47">_</tspan>
  </text>
  <!-- Brand name -->
  <text x="600" y="380" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="400" font-size="36" fill="#4a5e55">mpsoftware</text>
  <!-- Tagline -->
  <text x="600" y="430" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="400" font-size="24" fill="#6b8a7a">desenvolvimento web &amp; suporte técnico</text>
</svg>
